<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>ScreenMate</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app-container">
      <!-- 말풍선 대사 / 상태 표시 UI -->
      <div id="speech-bubble" class="bubble-hidden">
        <div id="bubble-text">대기 중이에요</div>
      </div>

      <!-- 캐릭터 컨테이너: Live2D Canvas와 2D Image를 모두 수용 -->
      <div id="character-container">
        <canvas id="live2d-canvas"></canvas>
        <img id="image-character" class="hidden" alt="2D Character" />
      </div>

      <!-- 클릭 영역 보기: 마우스 위치에 "클릭됨(초록) / 통과(회색)" 표시 -->
      <div id="hit-indicator" class="hidden" aria-hidden="true"></div>

      <!-- 캐릭터 변경 미니 힌트 -->
      <div id="char-hint">
        <span id="char-name">Mao (Live2D)</span>
        <button id="switch-btn" title="캐릭터 랜덤 전환">🎲</button>
      </div>

      <!-- 우클릭 미니멀 팝업 메뉴 -->
      <div id="context-menu" class="hidden">
        <div class="menu-header">ScreenMate 🐾</div>
        
        <div class="menu-section">
          <div class="menu-label">🔍 크기 조절 (휠 조절 가능)</div>
          <div class="scale-presets">
            <button class="scale-btn" data-scale="0.6">60%</button>
            <button class="scale-btn" data-scale="1.0">100%</button>
            <button class="scale-btn" data-scale="1.5">150%</button>
            <button class="scale-btn" data-scale="2.0">200%</button>
          </div>
          <div class="slider-row">
            <input id="scale-slider" type="range" min="60" max="200" step="1" value="100" aria-label="캐릭터 크기" />
            <span id="scale-value" class="slider-value">100%</span>
          </div>
        </div>

        <div class="menu-divider"></div>

        <button id="toggle-top-btn" class="menu-item">
          <span class="menu-icon">📌</span>
          <span id="top-status-text">항상 위에 고정: ON</span>
        </button>

        <button id="toggle-lock-btn" class="menu-item">
          <span class="menu-icon" id="lock-icon">🔓</span>
          <span id="lock-status-text">위치 잠금: OFF</span>
        </button>

        <button id="toggle-hitview-btn" class="menu-item">
          <span class="menu-icon">🎯</span>
          <span id="hitview-status-text">클릭 영역 보기: OFF</span>
        </button>

        <div class="menu-section">
          <button id="toggle-sfx-btn" class="menu-item">
            <span class="menu-icon" id="sfx-icon">🔇</span>
            <span id="sfx-status-text">효과음: OFF</span>
          </button>
          <div class="slider-row" id="sfx-volume-row">
            <input id="sfx-volume" type="range" min="0" max="100" step="5" value="50" aria-label="효과음 볼륨" />
            <span id="sfx-volume-value" class="slider-value">50%</span>
          </div>
        </div>

        <button id="menu-switch-char-btn" class="menu-item">
          <span class="menu-icon">🎲</span>
          <span>캐릭터 랜덤 전환</span>
        </button>

        <button id="menu-settings-btn" class="menu-item">
          <span class="menu-icon">⚙️</span>
          <span>캐릭터 매니저 (추가/설정)</span>
        </button>

        <button id="menu-recenter-btn" class="menu-item">
          <span class="menu-icon">🏠</span>
          <span>화면 가운데로 불러오기</span>
        </button>

        <button id="menu-hide-btn" class="menu-item">
          <span class="menu-icon">🫥</span>
          <span>트레이로 숨기기</span>
        </button>

        <div class="menu-divider"></div>

        <button id="menu-exit-btn" class="menu-item danger">
          <span class="menu-icon">❌</span>
          <span>종료</span>
        </button>
      </div>
    </div>

    <!-- Live2D 구동용 라이브러리: 로컬(lib/) 우선, 실패 시 CDN 폴백. 결과는 window.__live2dReady -->
    <script src="lib/live2d-loader.js"></script>

    <script src="sfx.js"></script>
    <script src="hittest.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
