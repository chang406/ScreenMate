<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="talkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="8" y="8" width="240" height="240" rx="24" fill="url(#talkGrad)" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.8"/>

  <!-- Icon (Sparkle / Check / Cheer) -->
  <g transform="translate(128, 75)" text-anchor="middle">
    <circle cx="0" cy="0" r="32" fill="#10b981" fill-opacity="0.15"/>
    <!-- Sparkle Star Icon -->
    <path d="M0 -18 L4 -5 L17 -1 L7 8 L9 21 L0 14 L-9 21 L-7 8 L-17 -1 L-4 -5 Z" fill="#34d399" fill-opacity="0.3" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Small sparkles -->
    <circle cx="18" cy="-14" r="2" fill="#6ee7b7"/>
    <circle cx="-16" cy="14" r="2" fill="#6ee7b7"/>
  </g>

  <!-- Badge -->
  <rect x="73" y="125" width="110" height="22" rx="11" fill="#10b981" fill-opacity="0.9"/>
  <text x="128" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">3. TALKING (완료)</text>

  <!-- Guide Text -->
  <text x="128" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">기쁜 표정 / 환호 / 쨘!</text>
  <text x="128" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">작업 완료, 답변 출력 시점</text>

  <!-- Resolution Tip -->
  <text x="128" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">💡 권장: 256x256 이상 투명 PNG/SVG</text>
</svg>
