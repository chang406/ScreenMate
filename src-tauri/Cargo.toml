[package]
name = "screen-mate"
version = "0.2.0"
description = "ScreenMate - Ultra-lightweight desktop screen mate overlay supporting Live2D and 2D characters reacting to Antigravity and Claude Code"
authors = ["you"]
edition = "2021"

[lib]
name = "screen_mate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
base64 = "0.22"
rfd = "0.15"
